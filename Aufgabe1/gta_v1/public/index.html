<!DOCTYPE html>

<!-- File origin: VS1LAB A1a -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTagApp</title>
    <link rel="stylesheet" href="./stylesheets/style.css" />
</head>

<body>
    <header class="header">
        <img src="./images/location.png" class="header__image" alt="an image of a map and location">
        <h1 class="header__title">GeoTagApp</h1>
        <nav class="header__navigation">
            <a href="#">About</a> | <a href="#">Help</a> | <a href="/">Home</a>
        </nav>
    </header>

    <main class="main">
        <section class="main__tagging tagging">
            <h2>Tagging</h2>

            <!-- ############### VS1Lab 1a Form 1 Start -->
            <form id="tag-form" action="/tagging" method="post">

                <fieldset>
                    <legend>Add a new GeoTag</legend>
                    <label for="tagging-latitude">Latitude:
                        <input id="tagging-latitude" name="latitude" type="number" step="any" value="49.01455" readonly>
                    </label>
                    <label for="tagging-longitude">Longitude:
                        <input id="tagging-longitude" name="longitude" type="number" step="any" value="8.39400" readonly>
                    </label>
                    <label for="tagging-name">Name:
                        <input id="tagging-name" name="name" type="text" placeholder="e.g. Central Berlin" pattern="[A-Za-zÄÖÜäöüß]{1,10}" maxlength="10" required>
                    </label>
                    <label for="tagging-hashtag">Hashtag:
                        <input id="tagging-hashtag" name="hashtag" type="text" pattern="#[a-zA-Z]{1,10}" placeholder="e.g. #ber">
                    </label>
                    <input type="submit" value="Add Tag">
                </fieldset>
                 

            </form>
            <!-- ############### VS1Lab 1a Form 1 End -->

        </section>

        <section class="main__discovery discovery">
            <h2 class="discovery__title">Discovery</h2>

            <!-- ############### VS1Lab 1a Form 2 Start -->
            <form class="discovery__search" id="discoveryFilterForm" action="/discovery" method="post">

                <fieldset>
                    <legend>Search</legend>

                    <input type="hidden" id="discovery-latitude" name="latitude" value="49.01455">
                    <input type="hidden" id="discovery-longitude" name="longitude" value="8.39400">

                    <label for="discovery-searchterm">Search term or keywords: 
                        <input id="discovery-searchterm" name="searchterm" type="text" placeholder="e.g. Berlin">
                    </label>
                    <input type="submit" value="Search">
                </fieldset>

            </form>
            <!-- ############### VS1Lab 1a Form 2 End -->

            <div class="discovery__wrapper">
                <div class="discovery__taglist">
                    <ul class="discovery__results" id="discoveryResults">
                        <li>Castle (49.01379, 8.404435) #sight</li>
                        <li>IWI (49.01379, 8.390071) #edu</li>
                    </ul>
                </div>

                <div id="map" class="discovery__map">
                    <img src="./images/mapview.jpg" alt="a map with locations" id="mapView" />
                    <span>Result map</span>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <span>(c) 2026 HKA_IWI_VSYS</span>
    </footer>
</body>

</html>
